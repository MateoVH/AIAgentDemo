name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore AIAgentDemo.slnx

      - name: Build
        run: dotnet build AIAgentDemo.slnx --configuration Release --no-restore

      - name: Test (demo model, no API keys needed)
        run: dotnet test AIAgentDemo.slnx --configuration Release --no-build --verbosity normal
